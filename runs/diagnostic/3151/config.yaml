model:
  model: vit
  binary: true
  pretrained: true
  params:
    drop_path_rate: 0.2
    dropout: 0.4
data:
  train:
  - dataset: rsna
    split: splits/rsna/match-sinoct-train.parquet
  val:
  - dataset: rsna
    split: splits/rsna/match-sinoct-val.parquet
  predict:
  - dataset: rsna
    split: splits/rsna/match-sinoct-val.parquet
    name: rsna-match-sinoct-val
  - dataset: rsna
    split: splits/rsna/no-match-sinoct-train.parquet
    name: rsna-no-match-sinoct-train
  - dataset: rsna
    split: splits/rsna/no-match-sinoct-val.parquet
    name: rsna-no-match-sinoct-val
  - dataset: rsna
    split: splits/rsna/no-match-sinoct-test.parquet
    name: rsna-no-match-sinoct-test
  - dataset: bhx
    split: splits/bhx/all.parquet
    name: bhx-all
training:
  epochs: 100
  batch_size: 256
  patience: 7
  eval_metric: auroc
  num_workers: 16
  device: cuda
  use_sample_weights: false
optimizer:
  lr: 5.0e-05
  lr_min: 1.0e-06
  weight_decay: 0.001
loss:
  name: bce
  use_pos_weights: false
